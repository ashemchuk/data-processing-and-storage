plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

group = 'ru.ashemchuk'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
    }
    doLast {
        println "JaCoCo report: ${reports.html.outputLocation.get().file('index.html').asFile.toURI()}"
    }
}

application {
    mainClass = 'ru.ashemchuk.Main'
}

tasks.named('run') {
    standardInput = System.in
}
